name: iOS Build (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  XCODEGEN_VERSION: 2.43.0

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd CarKeeper
          xcodegen generate
          ls -la

      - name: Build IPA (unsigned)
        run: |
          cd CarKeeper
          xcodebuild build \
            -project CarKeeper.xcodeproj \
            -scheme CarKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            -quiet

      - name: Package IPA
        run: |
          cd CarKeeper
          # 定位 build 输出目录（xcodebuild 默认在 DerivedData 里）
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          if [ -z "$APP_PATH" ]; then
            # 兜底：在仓库内找
            APP_PATH=$(find . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          fi
          if [ -z "$APP_PATH" ]; then echo "CarKeeper.app not found"; exit 1; fi
          echo "App: $APP_PATH"
          # 打包成 Payload/ 结构（ipa 就是 Payload/xxx.app 的 zip）
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 打成 ipa
          zip -qr "CarKeeper-unsigned.ipa" Payload
          # 同时把 ipa 复制成 zip 附件（便于 Actions 直接下载）
          zip -qr "CarKeeper-unsigned.zip" "CarKeeper-unsigned.ipa"
          ls -la

      - name: Upload Release (tag=latest)
        run: |
          cd CarKeeper
          echo "latest ${GITHUB_SHA:0:8} $(date +'%Y-%m-%d %H:%M')" > CarKeeper-release-note.txt
          gh release delete latest --force 2>/dev/null || true
          gh release create latest \
            --title "CarKeeper unsigned build" \
            --notes-file CarKeeper-release-note.txt \
            CarKeeper-unsigned.ipa \
            CarKeeper-unsigned.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Failure hint
        if: failure()
        run: |
          echo "构建失败。请在 Actions 页面查看日志。常见原因："
          echo "  1. Xcode 版本与 XcodeGen 生成工程不兼容"
          echo "  2. Swift 编译错误（查看 build 日志）"
