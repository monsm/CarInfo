name: iOS Build (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  XCODEGEN_VERSION: 2.43.0

jobs:
  # 先跑一遍本地静态检查器（Linux，秒级）。
  # 存在的理由：一个编译错误要占用一整轮 macOS runner（约 3 分钟，而 macOS 额度是
  # 按 10 倍计费的）。2026-09-21 那次失败就是 lexguard 能秒级拦下的那一类
  # （字符串里嵌了 ASCII 双引号）。
  # 它**不替代**编译：符号、结构、API 名字能查，类型检查查不了 —— 真正的编译仍是 xcodebuild。
  static-gate:
    name: Static gate (seconds, no Xcode)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 静态检查器
        run: |
          echo "::group::check_style.js"
          node CarKeeper/check_style.js
          echo "::endgroup::"
          # paths.py 必须在最前：它验证 project.yml 声明的路径真的存在。
          # 2026-09-22 那次 CI 就是在 xcodegen generate 阶段以
          # 「missing source directory .../HealthKit」直接失败的（删目录时漏删声明，
          # 而本地开发机上那个空壳目录还在，怎么试都试不出来）。
          for s in paths access lexguard scan logic shadowguard scenes targets unreachable futureproof orphans deep eol; do
            echo "::group::$s.py"
            python3 scan/$s.py
            echo "::endgroup::"
          done

  build-unsigned-ipa:
    name: Build unsigned IPA
    needs: static-gate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd CarKeeper
          xcodegen generate
          ls -la

      - name: Build IPA (unsigned)
        run: |
          cd CarKeeper
          xcodebuild build \
            -project CarKeeper.xcodeproj \
            -scheme CarKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            -quiet

      - name: Package IPA
        run: |
          cd CarKeeper
          # 定位 build 输出目录（xcodebuild 默认在 DerivedData 里）
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          if [ -z "$APP_PATH" ]; then
            # 兜底：在仓库内找
            APP_PATH=$(find . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          fi
          if [ -z "$APP_PATH" ]; then echo "CarKeeper.app not found"; exit 1; fi
          echo "App: $APP_PATH"
          # 打包成 Payload/ 结构（ipa 就是 Payload/xxx.app 的 zip）
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 打成 ipa
          zip -qr "CarKeeper-unsigned.ipa" Payload
          # 同时把 ipa 复制成 zip 附件（便于 Actions 直接下载）
          zip -qr "CarKeeper-unsigned.zip" "CarKeeper-unsigned.ipa"
          ls -la

      - name: Upload artifacts (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CarKeeper-unsigned
          path: |
            CarKeeper/CarKeeper-unsigned.ipa
            CarKeeper/CarKeeper-unsigned.zip
          retention-days: 30

      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建覆盖），
      # 供 App 内「检查更新」直接下载分享。私库需要带 token。
      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建追加附件）。
      # 供 App 内「检查更新」直接下载分享。
      - name: Upload Release (tag=latest)
        run: |
          cd CarKeeper
          NOTE="CarKeeper unsigned build · ${GITHUB_SHA:0:8} · $(date +'%Y-%m-%d %H:%M')"
          # 先创建或更新 Release（无附件），再用 upload 追加文件
          gh release create latest --title "$NOTE" --notes "" --prerelease || true
          gh release upload latest CarKeeper-unsigned.ipa --clobber || true
          gh release upload latest CarKeeper-unsigned.zip --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 编译体检（非阻断）：把 `scheme CarKeeper` **看不见**的那些 target 也编一遍。
      #
      # 为什么需要它：scheme 的 build action 只列了 CarKeeper 一个 target，所以
      # WidgetBundle / CarPlay / AppClip / WatchApp / WatchKitApp 这 5 个
      # **从来没有被 CI 编译过一次** —— 里面有错也看不见，问题只会在别人真正
      # 去构建它们的那天集中爆发。
      #
      # 为什么现在是非阻断：它们第一次被编译，大概率有错（先从没编过）；
      # 先把错误照出来，比让整条流水线红掉更有用。等它绿了就该把它改成阻断的。
      #
      # 下面这份清单是**唯一**的 target 覆盖说明，`scan/paths.py` 会读它：
      # 新增了 target 却忘了加进这里，会被静态门禁直接拦下（Linux 上，秒级）。
      - name: Compile other targets (non-blocking health check)
        continue-on-error: true
        run: |
          cd CarKeeper
          fail=0
          for pair in WidgetBundle:iphoneos CarPlay:iphoneos AppClip:iphoneos WatchApp:watchos WatchKitApp:watchos; do
            t="${pair%%:*}"
            sdk="${pair##*:}"
            echo "::group::编译 $t ($sdk)"
            # 注意：不要写成 `xcodebuild ... | tail` —— 管道的退出码取自 tail（恒为 0），
            # 失败会被当成成功。先落盘再判断。
            if xcodebuild build \
                 -project CarKeeper.xcodeproj \
                 -target "$t" \
                 -configuration Release \
                 -sdk "$sdk" \
                 CODE_SIGNING_ALLOWED=NO \
                 CODE_SIGNING_REQUIRED=NO \
                 -derivedDataPath "./DerivedData-$t" \
                 -quiet > "/tmp/$t.log" 2>&1; then
              echo "✅ $t 编译通过"
            else
              echo "❌ $t 编译失败："
              tail -60 "/tmp/$t.log"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" != 0 ]; then
            echo "::warning title=target 编译体检未全绿::上面有 target 编译失败。它们目前不作为门禁（从未被编译过，先看清错误）；修完应改为阻断。"
          fi
          exit 0

      - name: Failure hint
        if: failure()
        run: |
          echo "构建失败。请在 Actions 页面查看日志。常见原因："
          echo "  1. Xcode 版本与 XcodeGen 生成工程不兼容"
          echo "  2. Swift 编译错误（查看 build 日志）"
          echo "  3. 资源缺失"

  # 单元测试 job 已删除（2026-09-22，按用户要求）。
  #
  # 它原本是「纯函数测试（光的太阳位置、充电站聚合）」的唯一边一执行处，非阻断。
  # 删掉的理由是成本：每次 push 都要占一整个 macOS runner（额度按 10 倍计费），
  # 而它是 continue-on-error —— 红不红都不影响构建。
  #
  # 失去的东西要说清楚：`Tests/PureLogicTests.swift` 从此**不再被任何 CI 编译过**。
  # target 与 scheme 都还在，开发机上的 Xcode 可以直接跑（Product > Test）。
  # 为此 `scan/paths.py` 的「每个 target 都必须被 CI 编到」那条规则里，
  # `CarKeeperTests` 被**显式豁免并写了理由** —— 不能靠沉默蒙过去。
