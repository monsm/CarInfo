name: iOS Build (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  XCODEGEN_VERSION: 2.43.0

jobs:
  # 先跑一遍本地静态检查器（Linux，秒级）。
  # 存在的理由：一个编译错误要占用一整轮 macOS runner（约 3 分钟，而 macOS 额度是
  # 按 10 倍计费的）。2026-09-21 那次失败就是 lexguard 能秒级拦下的那一类
  # （字符串里嵌了 ASCII 双引号）。
  # 它**不替代**编译：符号、结构、API 名字能查，类型检查查不了 —— 真正的编译仍是 xcodebuild。
  static-gate:
    name: Static gate (seconds, no Xcode)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 静态检查器
        run: |
          echo "::group::check_style.js"
          node CarKeeper/check_style.js
          echo "::endgroup::"
          # paths.py 必须在最前：它验证 project.yml 声明的路径真的存在。
          # 2026-09-22 那次 CI 就是在 xcodegen generate 阶段以
          # 「missing source directory .../HealthKit」直接失败的（删目录时漏删声明，
          # 而本地开发机上那个空壳目录还在，怎么试都试不出来）。
          for s in paths lexguard scan logic shadowguard scenes targets unreachable futureproof orphans deep eol; do
            echo "::group::$s.py"
            python3 scan/$s.py
            echo "::endgroup::"
          done

  build-unsigned-ipa:
    name: Build unsigned IPA
    needs: static-gate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd CarKeeper
          xcodegen generate
          ls -la

      - name: Build IPA (unsigned)
        run: |
          cd CarKeeper
          xcodebuild build \
            -project CarKeeper.xcodeproj \
            -scheme CarKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            -quiet

      - name: Package IPA
        run: |
          cd CarKeeper
          # 定位 build 输出目录（xcodebuild 默认在 DerivedData 里）
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          if [ -z "$APP_PATH" ]; then
            # 兜底：在仓库内找
            APP_PATH=$(find . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          fi
          if [ -z "$APP_PATH" ]; then echo "CarKeeper.app not found"; exit 1; fi
          echo "App: $APP_PATH"
          # 打包成 Payload/ 结构（ipa 就是 Payload/xxx.app 的 zip）
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 打成 ipa
          zip -qr "CarKeeper-unsigned.ipa" Payload
          # 同时把 ipa 复制成 zip 附件（便于 Actions 直接下载）
          zip -qr "CarKeeper-unsigned.zip" "CarKeeper-unsigned.ipa"
          ls -la

      - name: Upload artifacts (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CarKeeper-unsigned
          path: |
            CarKeeper/CarKeeper-unsigned.ipa
            CarKeeper/CarKeeper-unsigned.zip
          retention-days: 30

      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建覆盖），
      # 供 App 内「检查更新」直接下载分享。私库需要带 token。
      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建追加附件）。
      # 供 App 内「检查更新」直接下载分享。
      - name: Upload Release (tag=latest)
        run: |
          cd CarKeeper
          NOTE="CarKeeper unsigned build · ${GITHUB_SHA:0:8} · $(date +'%Y-%m-%d %H:%M')"
          # 先创建或更新 Release（无附件），再用 upload 追加文件
          gh release create latest --title "$NOTE" --notes "" --prerelease || true
          gh release upload latest CarKeeper-unsigned.ipa --clobber || true
          gh release upload latest CarKeeper-unsigned.zip --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Failure hint
        if: failure()
        run: |
          echo "构建失败。请在 Actions 页面查看日志。常见原因："
          echo "  1. Xcode 版本与 XcodeGen 生成工程不兼容"
          echo "  2. Swift 编译错误（查看 build 日志）"
          echo "  3. 资源缺失"

  # 纯函数测试（光的太阳位置、充电站聚合）—— **非阻断**。
  #
  # 为什么单独一个 job：这些函数错了不会崩、也不会有编译错误，只会安静地给出
  # 错的光和错的圈；而开发机上没有 Swift 工具链，只有 macOS runner 能跑它们。
  #
  # 为什么 continue-on-error：模拟器镜像与 Xcode 版本会随 runner 漂移，
  # 「找不到 iPhone 17」这类失败与代码无关，不该把它算成构建失败。
  # 日志里会写清用的是哪个模拟器 —— 真正的测试失败一眼能看出来。
  unit-tests:
    name: Unit tests (pure logic, non-blocking)
    needs: static-gate
    runs-on: macos-latest
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: cd CarKeeper && xcodegen generate

      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print([v['udid'] for k, v in d.items() if 'iOS' in k for v in v if v['isAvailable']][0])
          ")
          echo "使用模拟器：$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          cd CarKeeper
          xcodebuild test \
            -project CarKeeper.xcodeproj \
            -scheme CarKeeperTests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet
