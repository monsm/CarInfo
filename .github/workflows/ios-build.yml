name: iOS Build (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  XCODEGEN_VERSION: 2.43.0

jobs:
  # 先跑一遍本地静态检查器（Linux，秒级）。
  # 存在的理由：一个编译错误要占用一整轮 macOS runner（约 3 分钟，而 macOS 额度是
  # 按 10 倍计费的）。2026-09-21 那次失败就是 lexguard 能秒级拦下的那一类
  # （字符串里嵌了 ASCII 双引号）。
  # 它**不替代**编译：符号、结构、API 名字能查，类型检查查不了 —— 真正的编译仍是 xcodebuild。
  static-gate:
    name: Static gate (seconds, no Xcode)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 静态检查器
        run: |
          echo "::group::check_style.js"
          node CarKeeper/check_style.js
          echo "::endgroup::"
          # paths.py 必须在最前：它验证 project.yml 声明的路径真的存在。
          # 2026-09-22 那次 CI 就是在 xcodegen generate 阶段以
          # 「missing source directory .../HealthKit」直接失败的（删目录时漏删声明，
          # 而本地开发机上那个空壳目录还在，怎么试都试不出来）。
          # design.py：字号 / 颜色分量 / 色相字面量只允许出现在令牌定义文件里。
          # 这一条把「完全统一」变成可执行的约束 —— 否则下一轮又会有人写 .font(.system(size: 14))，
          # 而没有任何东西会出声（它编译得过、看起来也“能用”）。
          # keys.py：报文键只准通过 ci* 家族读取。
          # 2026-09-22 抓包证实服务端键一律首字母小写（remainPower / totalOdometer），
          # 而我们 Swift 的 [String: Any] 下标是大小写敏感的 —— 写成 ["RemainPower"] 就是
          # 永远 nil，而 nil 经过 num() 又常常变成 0，于是界面显示成一种「正常状态」
          # （车锁车窗恒「已锁/已关」就是这么来的）。这类 bug 不报错、不崩溃，只能靠门禁。
          # oneentry.py：入口唯一性。项目反复长回「缝合怪」的机制只有一个 ——
          # 同一个功能又长出第二个入口（5 个 Tab / 顶部图层胶囊 / 索引页那一整份
          # 「全部功能」目录 / 「我的」27 个磁贴 / 4 个没人发射的导航通知，全是这么来的）。
          # 改一次不难，难的是下一次改动不再加回去；这条把约定变成 CI 会拦下的约束。
          # traps.py：编译得过、但真机一走到那行就崩的构造（hashValue 参与算术、
          # 日期/调用结果强解包、try! / as!）。
          # 2026-09-23 真机崩溃就是这么来的：`6 + type.hashValue * 2` 溢出（SIGTRAP），
          # 而那行在默认值里 —— 也就是「只要用户没存过提醒，切到车辆档必崩」。
          # 17 项门禁全绿、本地看不出、连编译器都不出声；能出声的只有真机报告。
          # scopeguard.py：作用域。2026-09-23 那轮 CI 红了 12 个错误，其中 8 个是同一个成因：
          # 把四处 `arr.isEmpty ? "--" : arr.min()!` 收成助手时，调用写成了裸名字，
          # 而助手住在 `enum AN` 里、调用点在顶层函数内。名字在项目里**确实存在**，
          # 所以 scan.py 放行（它只查「有没有声明」），能看见的只有 macOS 上那台编译器。
          # 这条把「跳类型调静态成员必须带前缀」变成 Linux 上秒级可查的约束，
          # 代价只是一次本地运行，而它可以省下一整轮 10 倍计费的 macOS runner。
          # paidcap.py：免费 Apple 个人账号（未付 99 美金）用不了的能力。
          # 已因此删过四轮：CloudKit 同步、BGTaskScheduler、CarPlay target、AppClip target。
          # 这类东西的特征是「编译得过、UI 上看得见入口、点下去永远拿不到东西」——
          # 代码里存在一个用户永远用不了的假功能，后来的人还会照着它继续写。
          # copy.py：界面文案。上一条 line 与这一条都是「能写出规则就不靠人重读一遍」的产物：
          # 精简过一遍文案之后，如果没有任何机器盯住「回潮」，下一轮又会慢慢长回教学式长句。
          # 判据只有三类（每一条都对应真实删过的一句话）：实现词不许上界面（缓存/报文/字段/接口）、
          # 复述句式不许用（「点下面…就会…」）、长句不许超 30 字。走的是全量字面量，不是抽样。
          # lintcfg.py：`SwiftLint 配置与真实文件树必须一致。它查出两件事（两半都错着）：
          # ① `.swiftlint.yml` 的 excluded 路径基准错了一层（配置住在 CarKeeper/，SwiftLint
          #    按配置文件所在目录解析，于是那 5 条全部空转）；② 删扩展留下的
          #    WatchApp / Widgets 两条指向已删目录，而 1126 行的 MapSpineView 反倒没进清单。
          # 它不需要 swiftlint、不需要 macOS —— 能在 Linux 上秒级拦住「配置与代码各走各的」。
          for s in paths design keys access lexguard scan logic shadowguard scenes targets unreachable futureproof orphans deep eol oneentry traps scopeguard paidcap copy lintcfg ternary; do
            echo "::group::$s.py"
            python3 scan/$s.py
            echo "::endgroup::"
          done

  build-unsigned-ipa:
    name: Build unsigned IPA
    needs: static-gate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd CarKeeper
          xcodegen generate
          ls -la

      - name: Build IPA (unsigned)
        run: |
          cd CarKeeper
          xcodebuild build \
            -project CarKeeper.xcodeproj \
            -scheme CarKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            -quiet

      - name: Package IPA
        run: |
          cd CarKeeper
          # 定位 build 输出目录（xcodebuild 默认在 DerivedData 里）
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          if [ -z "$APP_PATH" ]; then
            # 兜底：在仓库内找
            APP_PATH=$(find . -name "CarKeeper.app" -type d 2>/dev/null | grep -v ".dSYM" | head -n1)
          fi
          if [ -z "$APP_PATH" ]; then echo "CarKeeper.app not found"; exit 1; fi
          echo "App: $APP_PATH"
          # 打包成 Payload/ 结构（ipa 就是 Payload/xxx.app 的 zip）
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 打成 ipa
          zip -qr "CarKeeper-unsigned.ipa" Payload
          # 同时把 ipa 复制成 zip 附件（便于 Actions 直接下载）
          zip -qr "CarKeeper-unsigned.zip" "CarKeeper-unsigned.ipa"
          ls -la

          # ------------------------------------------------------------------
          # IPA 内容体检。
          #
          # 这里曾有一段很详细的检查，用来回答「小组件为什么在系统里没得选」：
          # 列出 PlugIns/ 里每个 .appex 的扩展点、bundle id、**签没签**，
          # 再对比「有 / 没有 PlugIns」两种分支。
          #
          # 2026-09-23 那段检查的**结论已经落地**：小组件 / 表盘 / 灵动岛三个扩展
          # 已整体删除（免费账号拿不到 App Group，那条链路没有一条可用路径）。
          # 所以现在这里只做一件事：把包里的顶层结构打出来。
          # 预期结果里**不应该**再出现 PlugIns —— 出现了就说明有人把扩展加回来了。
          #
          # 全程 `|| true`：这是体检，不是门禁；任何一行都不允许把构建弄红。
          # ------------------------------------------------------------------
          echo "::group::IPA 内容体检"
          APP_NAME=$(basename "$APP_PATH")
          echo "App bundle: Payload/$APP_NAME"
          echo
          echo "顶层："
          ls -1 "Payload/$APP_NAME" | sed 's/^/  /' || true
          echo
          if [ -d "Payload/$APP_NAME/PlugIns" ]; then
            echo "⚠️  包里出现了 PlugIns —— 说明又有嵌套扩展被加回来了。"
            echo "    它们的界面依赖 App Group（免费账号拿不到），请不要重新引入。"
            ls -1 "Payload/$APP_NAME/PlugIns" | sed 's/^/  /' || true
          else
            echo "没有嵌套扩展（符合预期：只有 App 本体）。"
          fi
          echo
          echo -n "版本号: "; /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "Payload/$APP_NAME/Info.plist" 2>/dev/null || echo "（读不到）"
          echo "::endgroup::"

      - name: Upload artifacts (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CarKeeper-unsigned
          path: |
            CarKeeper/CarKeeper-unsigned.ipa
            CarKeeper/CarKeeper-unsigned.zip
          retention-days: 30

      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建覆盖），
      # 供 App 内「检查更新」直接下载分享。私库需要带 token。
      # 上传 ipa 到固定 tag=latest 的 GitHub Release（每次构建追加附件）。
      # 供 App 内「检查更新」直接下载分享。
      - name: Upload Release (tag=latest)
        run: |
          cd CarKeeper
          NOTE="CarKeeper unsigned build · ${GITHUB_SHA:0:8} · $(date +'%Y-%m-%d %H:%M')"
          # 先创建或更新 Release（无附件），再用 upload 追加文件
          gh release create latest --title "$NOTE" --notes "" --prerelease || true
          gh release upload latest CarKeeper-unsigned.ipa --clobber || true
          gh release upload latest CarKeeper-unsigned.zip --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 这里曾有一个「编译其他 target」的非阻断体检步：scheme 的 build action 只列了
      # CarKeeper，所以 WidgetBundle / WatchApp / WatchKitApp 需要通过它才被编译一次。
      # 2026-09-23：那三个 target 已整体删除，项目现在只有 CarKeeper 与 CarKeeperTests
      # 两个 target，而两者都在 CarKeeper scheme 里 —— 这一整步没有对象了，故删掉。
      # 将来若重新引入扩展 target，必须同时把这一步加回来（`scan/paths.py` 会拦住漏掉的情况）。

      - name: Failure hint
        if: failure()
        run: |
          echo "构建失败。请在 Actions 页面查看日志。常见原因："
          echo "  1. Xcode 版本与 XcodeGen 生成工程不兼容"
          echo "  2. Swift 编译错误（查看 build 日志）"
          echo "  3. 资源缺失"

  # 单元测试 job 已删除（2026-09-22，按用户要求）。
  #
  # 它原本是「纯函数测试（光的太阳位置、充电站聚合）」的唯一边一执行处，非阻断。
  # 删掉的理由是成本：每次 push 都要占一整个 macOS runner（额度按 10 倍计费），
  # 而它是 continue-on-error —— 红不红都不影响构建。
  #
  # 失去的东西要说清楚：`Tests/PureLogicTests.swift` 从此**不再被任何 CI 编译过**。
  # target 与 scheme 都还在，开发机上的 Xcode 可以直接跑（Product > Test）。
  # 为此 `scan/paths.py` 的「每个 target 都必须被 CI 编到」那条规则里，
  # `CarKeeperTests` 被**显式豁免并写了理由** —— 不能靠沉默蒙过去。
