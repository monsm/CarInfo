name: CarKeeper
options:
  bundleIdPrefix: com.you
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    APPLICATION_GROUP_IDENTIFIER: group.com.you.CarKeeper
    SWIFT_EMIT_LOC_STRINGS: 'YES'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  CarKeeper:
    type: application
    platform: iOS
    sources:
    - path: CarKeeper/
    - path: Design
    - path: Services
    - path: Models
    - path: CarKeeper/Models
    - path: HealthKit
    # 与小组件/实时活动共享的设计令牌与数据契约（同一批文件也被 WidgetBundle 编译）
    - path: Shared
    resources:
    - path: CarKeeper/Resources/Assets.xcassets
      group: Resources/Assets.xcassets
    # 原本这里还有 en.lproj / zh-Hans.lproj 两条资源 —— 但两个目录是空的
    # （一个 .strings 都没有），而且在干净检出里根本不存在（只有开发机的未跟踪目录）。
    # CFBundleLocalizations 只声明 zh_CN，界面文案全部是内联中文，所以这两条是死配置。
    info:
      path: CarKeeper/Resources/Info.plist
      properties:
        CFBundleDisplayName: 长安车管家
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
        - zh_CN
        # 深链：carkeeper:// 必须注册在 CFBundleURLTypes 下，裸的 CFBundleURLSchemes 键不会生效
        CFBundleURLTypes:
        - CFBundleURLName: com.you.CarKeeper
          CFBundleURLSchemes:
          - carkeeper
        NSLocationWhenInUseUsageDescription: 用于显示车辆当前位置
        # 以下是实际调用了对应 API 就必须存在的键，缺失会直接杀进程（不是报错）
        NSCameraUsageDescription: 用于拍摄车辆照片
        NSPhotoLibraryUsageDescription: 用于选择车辆照片
        NSPhotoLibraryAddUsageDescription: 用于保存车辆照片到相册
        NSFaceIDUsageDescription: 用于验证身份后访问敏感信息
        NSHealthShareUsageDescription: 用于读取健康数据换算碳减排
        NSHealthUpdateUsageDescription: 用于把碳减排数据写入健康 App
        # iCloud/CloudKit 总开关：未签名构建与侧载重签的包都没有 iCloud entitlement，
        # 构造 CKContainer 会抛出 Swift 无法捕获的 ObjC 异常并直接杀进程（表现为启动闪退）。
        # 只有用带 iCloud 容器的证书签名时才把它改成 true。
        CKCloudKitEnabled: false
        # 后台刷新（BGTaskScheduler）：标识符必须在这里声明，否则 register/submit 会抛 ObjC 异常直接杀进程
        UIBackgroundModes:
        - fetch
        BGTaskSchedulerPermittedIdentifiers:
        - com.carkeeper.refresh
        - com.carkeeper.longtask
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # ⚠️ UIRequiresFullScreen 曾在此声明为 true，已移除 —— 它于 iOS 26.0 被 Apple 弃用（迁移指引 TN3192），
        # 而它的作用恰恰是「把 iPad app 放进兼容模式、退出多任务与动态缩放」，与 #47 的 iPad 分屏目标正相反。
        # 若将来确需限制窗口尺寸，改用 UISceneSizeRestrictions，不要再把这个键加回来。
        #
        # #47 iPad 多窗口/分屏：UIApplicationSupportsMultipleScenes 必须嵌在 UIApplicationSceneManifest
        # 字典里 —— 写成顶层键系统读不到，此时 openWindow(id:) 会以「app does not support multiple scenes」
        # 静默失败，界面上的入口点了没有任何反应。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # 实时活动总开关：缺这个键 Activity.request 不会生效，锁屏/灵动岛永远不会出现
        NSSupportsLiveActivities: true
        UIRequiredDeviceCapabilities:
        - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper
        PRODUCT_NAME: CarKeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
        # ⚠️ 路径相对 SRCROOT（即本目录），原值 CarKeeper/CarKeeper/… 多了一层，
        # 指向的是不存在的文件 —— 于是 App Group 等 entitlements 一直没被用上。
        CODE_SIGN_ENTITLEMENTS: CarKeeper/CarKeeper.entitlements
    dependencies:
    # 小组件/实时活动扩展必须由 App 依赖，才会被构建并嵌入 App 包里；
    # 反过来写（扩展依赖 App）不会产生 Embed 阶段，小组件在系统里永远不出现。
    - target: WidgetBundle
  WidgetBundle:
    # app-extension（不是 bundle）：只有真正的 appex 才会被系统注册为小组件宿主，
    # 也只有它才能被 Embed 进 App 包里。
    type: app-extension
    platform: iOS
    sources:
    - path: Widgets/
      excludes:
      - '**/.*'
    # 设计令牌（WT）与实时活动数据契约（ChargingActivityAttributes）与 App 同一份源文件
    - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        # ⚠️ WidgetKit 扩展点**只允许** NSExtensionPointIdentifier 这一个键。
        # 千万不要加 NSExtensionPrincipalClass / NSExtensionMainStoryboard ——
        # 安装时会直接被拒（这不是警告，是装不上）：
        #   AppexBundleContainsClassOrStoryboard (… WidgetBundle.appex … defines either
        #   an NSExtensionMainStoryboard or NSExtensionPrincipalClass key, which is not
        #   allowed for the extension point com.apple.widgetkit-extension)
        # 小组件的入口是代码里的 `@main struct CarKeeperWidgetBundle: WidgetBundle`，
        # 不需要（也不允许）在 plist 里再声明一次。
        # （CarPlay 那个 target 是另一回事：com.apple.carplay.app-service 确实需要
        #   PrincipalClass，所以它那里保留。）
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper.widget
        PRODUCT_NAME: WidgetBundle
        GENERATE_INFOPLIST_FILE: 'YES'
        ENABLE_PREVIEWS: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
        # 扩展要读 App 写在同一 App Group 里的快照，没有这份 entitlements 就只能读到 0
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        # 这个扩展不做任何网络请求（只读 App 写进 App Group 的快照），
        # 所以不声明 NSAppTransportSecurity —— 少一个键就少一处需要维护的差异。
        # 若将来小组件要自己联网（例如 AppIntent 里拉车况），在这里补回 ATS 并说明用途。
    # 这里原来写的是「扩展依赖 App」—— 方向反了：
    #   · 扩展无法 import App 模块（东西拿不到），
    #   · 而且 App 现在依赖本目标，两边互指会构成依赖循环。
    # 扩展真正需要的东西（设计令牌 + 数据契约）由上面的 Shared/ 直接提供。
    dependencies: []
  # 原来的 ChargingLiveActivity 目标已删除：实时活动的界面必须住在**小组件扩展**里
  # （扩展点 com.apple.widgetkit-extension + ActivityConfiguration），
  # 而原目标用的是 com.apple.usernotifications.liveactivity —— 那个扩展点不存在，
  # 而且它只声明了一个普通 View，所以实时活动从未出现过。
  # 现在：界面在 Widgets/WidgetBundle.swift，数据契约在 Shared/ChargingActivityAttributes.swift。
  WatchApp:
    type: bundle
    platform: watchOS
    sources:
    # 只编译扩展自身的两个文件；WatchApp/WatchApp/Sources 属于 WatchKitApp target，
    # 若整个目录递归收录会出现同名类型重复声明。
    - path: WatchApp/WatchApp.swift
    - path: WatchApp/ComplicationController.swift
    info:
      path: WatchApp/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.watchkit
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.you.CarKeeper.watchkitapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper.watchkitextension
        PRODUCT_NAME: WatchApp
        GENERATE_INFOPLIST_FILE: 'YES'
        ENABLE_PREVIEWS: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
        WATCHOS_DEPLOYMENT_TARGET: '26.0'
    dependencies:
    - target: CarKeeper
  WatchKitApp:
    type: application
    platform: watchOS
    sources:
    - path: WatchApp/WatchApp/Sources
      excludes:
      - '**/.*'
    info:
      path: WatchApp/WatchApp/Info.plist
      properties:
        WKCompanionAppBundleIdentifier: com.you.CarKeeper
        WKWatchKitApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper.watchkitapp
        PRODUCT_NAME: WatchKitApp
        CODE_SIGN_ENTITLEMENTS: WatchApp/WatchApp.entitlements
        WATCHOS_DEPLOYMENT_TARGET: '26.0'
        GENERATE_INFOPLIST_FILE: 'NO'
    dependencies:
    - target: WatchApp
  CarPlay:
    type: bundle
    platform: iOS
    sources:
    - path: CarPlay/
      excludes:
      - '**/.*'
    info:
      path: CarPlay/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.carplay.app-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CPParentViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper.carplay
        PRODUCT_NAME: CarPlay
        GENERATE_INFOPLIST_FILE: 'YES'
        ENABLE_PREVIEWS: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
    dependencies:
    - target: CarKeeper
  AppClip:
    type: application
    platform: iOS
    sources:
    - path: AppClip/
      excludes:
      - '**/.*'
    resources:
    - path: AppClip/AppClipIcon.imagestack
      group: AppClipIcon
    info:
      path: AppClip/Info.plist
      properties:
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        # 与主 app 同理：URL scheme 必须挂在 CFBundleURLTypes 下，裸键无效
        CFBundleURLTypes:
        - CFBundleURLName: com.you.CarKeeper.clip
          CFBundleURLSchemes:
          - carkeeper-clip
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper.clip
        PRODUCT_NAME: AppClip
        CODE_SIGN_ENTITLEMENTS: AppClip/AppClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppClipIcon
        GENERATE_INFOPLIST_FILE: 'NO'
        APP_CLIP: true
    dependencies:
    - target: CarKeeper
