name: CarKeeper
options:
  bundleIdPrefix: com.you
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: 'YES'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  CarKeeper:
    type: application
    platform: iOS
    sources:
    - path: CarKeeper/
    - path: Design
    - path: Services
    - path: Models
    - path: CarKeeper/Models
    # ⚠️ 这里曾声明 `- path: HealthKit`。那个目录的唯一文件 HealthKitManager.swift
    # 在「删死代码」那一批里被删掉了，而 git 不跟踪空目录 —— 于是它在干净检出里
    # 不存在，XcodeGen 直接以「missing source directory」失败：整轮 CI 连编译都没开始。
    # 本地开发机上目录还在（被删文件留下的空壳），所以本地 `xcodegen generate` 不会报。
    # 该目录里的类型已全仓零引用，不再重新创建。现在由 `scan/paths.py` 守住这类声明。
    #
    # ⚠️ 这里曾声明 `- path: Shared`（与小组件/实时活动共享的设计令牌与数据契约）。
    # 那一整套随小组件扩展一起删除，目录本身也不存在了 —— 留着它会让 XcodeGen
    # 以「missing source directory」直接失败（与上面 HealthKit 那次的成因相同）。
    resources:
    - path: CarKeeper/Resources/Assets.xcassets
      group: Resources/Assets.xcassets
    # 原本这里还有 en.lproj / zh-Hans.lproj 两条资源 —— 但两个目录是空的
    # （一个 .strings 都没有），而且在干净检出里根本不存在（只有开发机的未跟踪目录）。
    # CFBundleLocalizations 只声明 zh_CN，界面文案全部是内联中文，所以这两条是死配置。
    info:
      path: CarKeeper/Resources/Info.plist
      properties:
        CFBundleDisplayName: 长安车管家
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
        - zh_CN
        # 深链：carkeeper:// 必须注册在 CFBundleURLTypes 下，裸的 CFBundleURLSchemes 键不会生效
        CFBundleURLTypes:
        - CFBundleURLName: com.you.CarKeeper
          CFBundleURLSchemes:
          - carkeeper
        # 这句必须与代码里真的在问的东西一致（用户 2026-09-25：地图右侧加
        # 「手机的位置」那枚钮）。此前写的是「用于显示车辆当前位置」—— 而车的位置
        # 是**服务端**给的（AppStore 的车端报文），一直没碰过 CoreLocation：
        # 文案与行为对不上。现在手机自己的位置真的会被取（`Services/PhoneLocation.swift`），
        # 所以这句话改成它真的做的事。
        NSLocationWhenInUseUsageDescription: 用于在地图上显示手机与车辆的位置
        # 以下是实际调用了对应 API 就必须存在的键，缺失会直接杀进程（不是报错）
        NSCameraUsageDescription: 用于拍摄车辆照片
        NSPhotoLibraryUsageDescription: 用于选择车辆照片
        NSPhotoLibraryAddUsageDescription: 用于保存车辆照片到相册
        NSFaceIDUsageDescription: 用于验证身份后访问敏感信息
        # ⚠️ 原本还有 NSHealthShare/UpdateUsageDescription 两条。
        # 用车数据写进 Apple 健康的那套代码（HealthKit 目录）已随死代码清理删除，
        # 全仓再没有任何 HKHealthStore / HealthKit API 调用 —— 留着这两条会让
        # 审核与用户以为 App 在读健康数据。缺声明不会闪退（只有真的调用才会）。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # ⚠️ UIRequiresFullScreen 曾在此声明为 true，已移除 —— 它于 iOS 26.0 被 Apple 弃用（迁移指引 TN3192），
        # 而它的作用恰恰是「把 iPad app 放进兼容模式、退出多任务与动态缩放」，与 #47 的 iPad 分屏目标正相反。
        # 若将来确需限制窗口尺寸，改用 UISceneSizeRestrictions，不要再把这个键加回来。
        #
        # #47 iPad 多窗口/分屏：UIApplicationSupportsMultipleScenes 必须嵌在 UIApplicationSceneManifest
        # 字典里 —— 写成顶层键系统读不到，此时 openWindow(id:) 会以「app does not support multiple scenes」
        # 静默失败，界面上的入口点了没有任何反应。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # ⚠️ 这里曾有 `NSSupportsLiveActivities: true`。实时活动的界面必须住在
        # 小组件扩展里，而那个扩展已随免费账号清理删除 —— 留着这个键等于告诉系统
        # 「本 App 提供实时活动」，实际却永远不会有。
        UIRequiredDeviceCapabilities:
        - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.CarKeeper
        PRODUCT_NAME: CarKeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
        # 无 entitlements：本 App 唯一需要过的是 App Group，而它随小组件一起删了。
        # 删掉这个键之前先确认过：现在没有任何能力需要签名文件，少一份文件就少一处
        # 「侧载重签时被摘掉」的可能。
    dependencies: []
  # ── 这里曾有 WidgetBundle / WatchApp / WatchKitApp 三个 target（2026-09-23 全删）──
  # 它们存在的唯一理由是「把车况快照投到 App 之外」：小组件、表盘、灵动岛都靠
  # App Group 里的那份共享快照活。而 App Group 恰好是免费（未缴费）开发者账号
  # **拿不到**的能力 —— 侧载工具重签名时会把它摘掉，于是小组件只会显示占位，
  # 甚至因为扩展未被签进包里而在系统里根本不出现。
  #
  # 用户的原话是「全删，包含界面也删，因为我没有交 99 美金」。于是：
  #   · Widgets/（WidgetBundle + 实时活动界面）、WatchApp/（表盘与 App）三个目录已删；
  #   · Shared/ 里的 WidgetTokens（WT 令牌）与 ChargingActivityAttributes 已删；
  #   · App 侧的 LiveActivityBridge 与 syncSharedDefaults 已删 —— 不再往外写任何快照；
  #   · 三份 entitlements 与 `APPLICATION_GROUP_IDENTIFIER` 已删。
  #
  # ⚠️ 不要「顺手」把它们加回来：这三个 target 在免费账号下**没有一条可用链路**，
  # 加回来只会让 CI 多编三个永远不会被装上的包。`scan/paidcap.py` 会在 CI 上拦住。
  # App Clip target 已删（2026-09-23）：它的调用前提是 Associated Domains 里的
  # `appclips:` 域，而那份 entitlement 上一轮已随免费账号清理一并移除 ——
  # 没有它，App Clip 在真实世界里**永远不会被拉起**；分发又只能走 App Store /
  # TestFlight（均需付费会员）。于是它只是一个「编译得动、但永远打不开」的 target，
  # 还占着一份图标与一个 target 的编译开销。真要用它，必须同时具备：
  # 付费会员 + 备案域名 + associated-domains entitlement + App Store 分发。

  # 纯函数测试（光的太阳位置、充电站聚合）。
  # 为什么值得存在：这些函数错了不会崩、也不会有编译错误，只会安静地给出错的光和错的圈。
  # 这台开发机没有 Swift 工具链，所以它们只在 CI 上跑
  # （.github/workflows/ios-build.yml 的 unit-tests job，非阻断）。
  CarKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests/
    dependencies:
    - target: CarKeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        # 单元测试要跑在宿主 App 里：`@testable import CarKeeper` 需要它
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CarKeeper.app/CarKeeper
        BUNDLE_LOADER: $(TEST_HOST)

# ─────────────────────────────────────────────────────────────────────────────
# Schemes
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 这两条都必须**显式声明**。
#
# 教训（2026-09-22 的 CI）：以前只写了下面那条 CarKeeperTests，注释里还想当然地写着
# 「CarKeeper scheme 是 XcodeGen 按 target 自动生成的」—— 实际上**一旦
# 显式给出 `schemes:`，就不会再为其它 target 自动生成方案了**。
# 于是干净检出里根本没有 CarKeeper scheme，xcodebuild 直接报：
#     The project named "CarKeeper" does not contain a scheme named "CarKeeper"
# 本地又会掩盖它：Xcode 打开工程时会自动补一个 scheme 出来。
#
# 现在由 `scan/paths.py` 守住：「工作流里 `-scheme X` 用到的每个名字，
# 必须在 schemes 里声明过、或是一个 target 名」。
schemes:
  # CI 构建 App 用的就是它（.github/workflows/ios-build.yml 的 -scheme CarKeeper）
  CarKeeper:
    build:
      targets:
        CarKeeper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - CarKeeperTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # 纯函数测试（光的太阳位置、充电站聚合）的 scheme。
  # CI **不再跑它**（2026-09-22 按用户要求删掉了单元测试 job：它要占一整个 macOS
  # runner，而 macOS 额度按 10 倍计费，且它是 continue-on-error、红不红都不影响构建）。
  # 保留这个 scheme 是为了开发机上还能 `Product > Test`。
  # 因此 `scan/paths.py` 的「每个 target 都必须被 CI 编到」那条规则里，
  # CarKeeperTests 被显式豁免并写了理由 —— 它确实不再参与 CI 编译。
  CarKeeperTests:
    build:
      targets:
        CarKeeper: all
    test:
      targets:
      - CarKeeperTests
