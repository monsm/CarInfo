<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  长安车管家 AppIcon — 琥珀金品牌色 + 车辆剪影
  设计规范：圆润现代风格，符合 iOS Human Interface Guidelines
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 琥珀金主渐变 -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347"/>
      <stop offset="40%" style="stop-color:#FF9F00"/>
      <stop offset="100%" style="stop-color:#D97300"/>
    </linearGradient>
    
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#0D0D1A"/>
    </linearGradient>
    
    <!-- 车身高光 -->
    <linearGradient id="carHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGradient)"/>
  
  <!-- 装饰光圈 -->
  <circle cx="512" cy="480" r="200" fill="url(#amberGradient)" opacity="0.1" filter="url(#glow)"/>
  <circle cx="512" cy="480" r="140" fill="url(#amberGradient)" opacity="0.15"/>
  
  <!-- 车辆剪影 -->
  <g filter="url(#shadow)">
    <!-- 车身主体 -->
    <path d="M
      200,580 
      Q 200,520 240,480
      L 320,380
      Q 340,340 380,320
      L 640,320
      Q 680,320 700,360
      L 760,480
      Q 800,520 820,580
      L 824,620
      Q 824,660 780,660
      L 720,660
      Q 700,660 690,640
      L 670,580
      Q 640,560 512,560
      Q 384,560 354,580
      L 334,640
      Q 324,660 304,660
      L 244,660
      Q 200,660 200,620
      Z
    " fill="url(#amberGradient)"/>
    
    <!-- 车窗 -->
    <path d="M
      360,380
      L 420,300
      Q 440,270 480,270
      L 580,270
      Q 620,270 640,300
      L 680,380
      Z
    " fill="#0D0D1A" opacity="0.8"/>
    
    <!-- 车窗高光 -->
    <path d="M
      360,380
      L 420,300
      Q 440,270 480,270
      L 520,270
      L 480,380
      Z
    " fill="url(#carHighlight)"/>
    
    <!-- 车头灯 -->
    <ellipse cx="240" cy="540" rx="35" ry="20" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>
    <ellipse cx="240" cy="540" rx="20" ry="12" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- 尾灯 -->
    <ellipse cx="780" cy="540" rx="25" ry="15" fill="#FF4444" opacity="0.8" filter="url(#glow)"/>
    
    <!-- 车轮 -->
    <circle cx="300" cy="660" r="55" fill="#1A1A2E" stroke="url(#amberGradient)" stroke-width="8"/>
    <circle cx="300" cy="660" r="35" fill="#0D0D1A"/>
    <circle cx="300" cy="660" r="15" fill="url(#amberGradient)"/>
    
    <circle cx="724" cy="660" r="55" fill="#1A1A2E" stroke="url(#amberGradient)" stroke-width="8"/>
    <circle cx="724" cy="660" r="35" fill="#0D0D1A"/>
    <circle cx="724" cy="660" r="15" fill="url(#amberGradient)"/>
    
    <!-- 车底光影 -->
    <ellipse cx="512" cy="720" rx="200" ry="20" fill="#000000" opacity="0.3"/>
  </g>
  
  <!-- 品牌标识 -->
  <text x="512" y="860" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="48" font-weight="600" fill="url(#amberGradient)" letter-spacing="8">
    长安车管家
  </text>
  <text x="512" y="910" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="400" fill="#FFFFFF" opacity="0.5" letter-spacing="12">
    CHANGAN CONNECT
  </text>
</svg>
