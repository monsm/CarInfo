<?xml version="1.0" encoding="UTF-8"?>
<!--
  长安车管家 AppIcon v2.0（浅色外观）—— **矢量对照**，不是出包的那一份。

  出包的唯一来源是 `generate_appicon_pillow.py`（它渲染浅色 / 深色 / 着色三套外观，
  共 21 张 PNG）。这个 SVG 是同一套几何的矢量写法，给人看、给人改设计用：
  改形状时**两个文件都要改**，几何常量（CAR / WHEELS / WINDOWS / ARC_*）以脚本里的为准。
  （为什么不让 SVG 直接出包：这台开发机上 cairosvg 与 ImageMagick 都没有，
  能跑通的只有 Pillow —— 详见 AppIcon-SPEC.md。）

  与 v1.0 的区别，四条都是「不符合 iOS 调性」的具体原因：
    ① v1 是深蓝黑底（亮度中位数 0.096）→ 主屏上就是一块黑；现在反过来：亮底 + 一个物体。
    ② v1 图上有两行文字（长安车管家 / CHANGAN CONNECT）→ 29pt 下是两团灰噪点，已删。
    ③ v1 自己画了圆角并内缩 4% → 系统还要再套一层 squircle，成品比邻居小一圈；
       现在满幅 1024，圆角交给系统。
    ④ v1 没有深色 / 着色外观 → 系统只能把同一张往两种外观里硬套。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#FF761A"/>
    </linearGradient>

    <!-- iOS 26 图标表面那层「玻璃高光」：顶上一道渐隐的白，没有它纯渐变会显得平 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 底部轻微压暗：给圆柱感，也让白色车尾不糊在亮底上 -->
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.68" stop-color="#782800" stop-opacity="0"/>
      <stop offset="1" stop-color="#782800" stop-opacity="0.10"/>
    </linearGradient>

    <!-- 车的镂空：轮拱 + 两扇窗。窗与轮拱透出的是**底色**（在脚本里是同一件事：
         从车身 mask 上挖掉），所以这里用一张反向遮罩，而不是再画一层底色。 -->
    <mask id="carHoles">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="320" cy="684" r="96" fill="#000"/>
      <circle cx="740" cy="684" r="96" fill="#000"/>
      <rect x="455" y="425" width="90" height="90" rx="30" fill="#000"/>
      <rect x="575" y="425" width="90" height="90" rx="30" fill="#000"/>
    </mask>
  </defs>

  <!-- 满幅底（不画圆角：系统会用 squircle 遮罩裁） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 车底那条弧：App 里「车钉外面那圈弧」（续航圈）的图形引用。
       圆心在车身上、只取下面一段 → 两端向上收、中间最低，读起来是地面/道路。
       它比车淡一档（0.22）：弧是底纹，不是主体。 -->
  <path d="M741,825 A250,250 0 0 1 307,825"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="26" stroke-linecap="round"/>

  <!-- 车身：折线 + 圆角接头。脚本里这一步是「模糊 + 阈值」（等效圆角半径 16）。 -->
  <g mask="url(#carHoles)">
    <path d="M180,780 L180,690 L248,612 L368,496 L470,372 L640,372
             L722,470 L804,552 L852,580 L868,690 L868,780 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round"/>
  </g>

  <!-- 轮毂：必须画在**遮罩之外**（在遮罩里会被轮拱一起挖掉）。
       一个实心的洞是窟窿，洞里有芯才是轮子。 -->
  <circle cx="320" cy="684" r="34" fill="#FFFFFF"/>
  <circle cx="740" cy="684" r="34" fill="#FFFFFF"/>

  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#shade)"/>
</svg>
