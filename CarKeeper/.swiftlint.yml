# SwiftLint 配置 — 长安车管家
# 参考: https://github.com/realm/SwiftLint/blob/master/Documents/rules.md

# 规则配置
disabled_rules:
  - todo
  - line_length  # 禁用行长度限制，允许长注释和文档

opt_in_rules:
  - array_init
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collects_testcase
  - conditional_returns_on_newline
  - contains_over_filter_is_empty
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - join_absolute_paths
  - last_where
  - legacy_hashing
  - legacy_random
  - modifier_order
  - overridden_super_call
  - override_in_extension
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# 警告阈值
warning_threshold: 100

# 错误阈值
error_threshold: 50

# 自定义规则：原先四条都指向已删除的 Kansei / DS.Palette / Theme 命名空间，
# SwiftLint 不跑 CI，留着只会让人以为代码里还有那些东西。现已全部删除；
# 颜色与令牌的约束由 scan/design.py 在 CI 上执行。

# 排除清单 —— **故意是空的**。
#
# 这里曾列着 5 条路径，而 5 条全是错的，两个方向都错（由 `scan/lintcfg.py` 查出）：
#
# ① **基准目录错了一层。** 它们写成 `CarKeeper/CarKeeper/Design/DS.swift`，而本配置
#    住在 `CarKeeper/.swiftlint.yml`。SwiftLint 文档写明：
#
#       included / excluded entries from each config are resolved relative to that
#       config file's directory.
#       —— https://realm.github.io/SwiftLint/
#
#    所以基准是 `CarKeeper/`，那条实际指向 `CarKeeper/CarKeeper/CarKeeper/Design/DS.swift`，
#    不存在。**整份清单是空转的**：swiftlint 从来没有排除过任何文件。
#    （`project.yml` 也住在同一个目录，同样是 `- path: Design` / `- path: CarKeeper/`
#    这种以 `CarKeeper/` 为基准的写法 —— 两个配置文件的基准是同一个。）
#
# ② **只减不增。** `CarKeeper/WatchApp` 与 `CarKeeper/Widgets` 在 2026-09-23 删掉
#    小组件/表盘时就没清掉，而代码继续长大（`MapSpineView.swift` 1126 行）也没进清单。
#
# 为什么不把这些路径**修对**、而是直接不再排除任何文件：
#
#   把文件写进 `excluded` 会让它**整份文件**退出 swiftlint —— 不只是字号/行数那几条，
#   而是连 `force_unwrapping`、`implicitly_unwrapped_optional`、`legacy_hashing` 这些
#   真正防事故的规则一起退出。被排除的恰好是最大、最复杂的那些文件 ——
#   用「关掉全部检查」去换「一条超长提示」，代价与收益差得太远。
#
#   于是把尺子调到与这份代码真实的形状相符的位置（下面三个阈值，余量按当前最大值给），
#   让**每个文件都被每一条规则检查**。尺寸规则仍然有牙：一旦越过下面任何一条，
#   `scan/lintcfg.py` 会在 Linux 上秒级失败，并明确要求你「要么改小、要么把阈值说清
#   为什么该调」—— 不能靠沉默蒙过去。
#
# 当前最大者（改阈值时的依据，由 lintcfg.py 量出）：
#   file_length           MapSpineView.swift 1126 行
#   type_body_length      MapSpineView 类型体 1080 行
#   function_body_length  MapSpineData.reasons / Analysis.batteryModel 各 136 行
excluded: []

# 配置文件格式
file_length:
  warning: 1200
  error: 2000

type_body_length:
  warning: 1200
  error: 2000

function_body_length:
  warning: 160
  error: 300

indentation_size:
  size: 4

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

vertical_whitespace:
  max_empty_lines: 2
